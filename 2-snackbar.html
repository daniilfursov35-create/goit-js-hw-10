<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор промісів</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-weight: 500;
    }

    .form input[type="number"] {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      display: flex;
      justify-content: space-around;
    }

    fieldset label {
      flex-direction: row;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    button[type="submit"] {
      padding: 10px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
  <script type="module" crossorigin src="/goit-js-hw-10/assets/2-snackbar-JZAI3D3k.js"></script>
  <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/iziToast.min-DJ1v-Ni1.js">
  <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/iziToast-DnveWo0P.css">
</head>
<body>

  <form class="form">
    <label>
      Delay (ms)
      <input type="number" name="delay" required />
    </label>

    <fieldset>
      <legend>State</legend>
      <label>
        <input type="radio" name="state" value="fulfilled" required />
        Fulfilled
      </label>
      <label>
        <input type="radio" name="state" value="rejected" required />
        Rejected
      </label>
    </fieldset>

    <button type="submit">Create notification</button>
  </form>

</body>
</html>
